<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080b12;
    color:#fff;
}

header{
    padding:35px 20px;
    text-align:center;
    background:linear-gradient(135deg,#101827,#080b12);
    border-bottom:1px solid #202938;
}

h1{
    margin:0;
    font-size:42px;
    letter-spacing:3px;
}

header p{
    color:#8d9aad;
}

.container{
    max-width:1100px;
    margin:auto;
    padding:25px 15px;
}

.search{
    width:100%;
    padding:16px;
    border-radius:12px;
    border:1px solid #273247;
    background:#101722;
    color:white;
    font-size:16px;
    outline:none;
}

.categories{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin:20px 0;
}

button{
    border:1px solid #29364b;
    background:#111925;
    color:#cbd5e1;
    padding:10px 16px;
    border-radius:10px;
    cursor:pointer;
}

button:hover{
    background:#1b2636;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:15px;
}

.card{
    background:#0f1621;
    border:1px solid #202c3d;
    border-radius:14px;
    padding:18px;
    transition:.2s;
}

.card:hover{
    transform:translateY(-3px);
    border-color:#415674;
}

.card h3{
    margin-top:0;
}

.card p{
    color:#8d9aad;
    font-size:14px;
    min-height:40px;
}

.card a{
    display:inline-block;
    margin-top:10px;
    padding:9px 13px;
    border-radius:8px;
    background:#182437;
    color:#fff;
    text-decoration:none;
}

.card a:hover{
    background:#253752;
}

.tag{
    display:inline-block;
    font-size:11px;
    padding:4px 7px;
    border-radius:6px;
    background:#192435;
    color:#9fb1c9;
}

footer{
    text-align:center;
    padding:35px;
    color:#687588;
}
</style>

let current="all";

function render(){

    const query=document
        .getElementById("search")
        .value
        .toLowerCase();

    const box=document.getElementById("tools");

    box.innerHTML="";

    tools
    .filter(t => current==="all" || t[1]===current)
    .filter(t => 
        t[0].toLowerCase().includes(query) ||
        t[2].toLowerCase().includes(query)
    )
    .forEach(t => {

        const card=document.createElement("div");

        card.className="card";

        card.innerHTML=`
            <span class="tag">${t[1].toUpperCase()}</span>
            <h3>${t[0]}</h3>
            <p>${t[2]}</p>
            <a href="${t[3]}" target="_blank" rel="noopener">
                Открыть →
            </a>
        `;

        box.appendChild(card);
    });
}

function filterTools(category){
    current=category;
    render();
}

document
.getElementById("search")
.addEventListener("input",render);
